[project]
name = "inbox-triage"
version = "0.1.0"
description = "Classify inbound email, draft replies in your voice, queue them for human approval, log everything. Pluggable LLM, offline evals."
readme = "README.md"
license = "MIT"
authors = [{ name = "Fady Youssef" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]
keywords = ["email", "automation", "llm", "claude", "triage", "human-in-the-loop"]

[project.urls]
Repository = "https://github.com/JustFady/inbox-triage"

[project.scripts]
inbox-triage = "inbox_triage.cli:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
